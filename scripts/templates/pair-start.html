<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; color: #222; }
    h2 { margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { margin-top: 18px; padding: 10px 18px; background: #F6405F; color: white; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }
    button:disabled { background: #999; cursor: not-allowed; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; }
    .error { color: #c00; margin-top: 14px; min-height: 1.2em; font-size: 14px; }
    .spinner { display: none; margin-left: 8px; }
    .spinner.visible { display: inline; }
  </style>
</head>
<body>
  <h2>Connect to your Solplanet inverter</h2>
  <p>Find the IP address in your router's DHCP table. The serial number is on the inverter's label.</p>

  <label for="ipAddress">IP address</label>
  <input type="text" id="ipAddress" placeholder="192.168.1.20" autocapitalize="off" autocomplete="off" spellcheck="false" />

  <label for="serialNumber">Serial number</label>
  <input type="text" id="serialNumber" placeholder="ABC1234567" autocapitalize="off" autocomplete="off" spellcheck="false" />

  <button id="continueBtn">Continue<span id="spinner" class="spinner">…</span></button>
  <div id="error" class="error"></div>

  <script>
    const ipEl = document.getElementById('ipAddress');
    const snEl = document.getElementById('serialNumber');
    const btn = document.getElementById('continueBtn');
    const spinner = document.getElementById('spinner');
    const errorEl = document.getElementById('error');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      spinner.classList.add('visible');
      errorEl.textContent = '';

      const ipAddress = ipEl.value.trim();
      const serialNumber = snEl.value.trim();

      try {
        const result = await Homey.emit('validate', { ipAddress, serialNumber });
        if (result && result.ok) {
          Homey.showView('list_devices');
          return;
        }
        errorEl.textContent = (result && result.error) || 'Validation failed.';
      } catch (err) {
        errorEl.textContent = (err && err.message) ? err.message : String(err);
      } finally {
        btn.disabled = false;
        spinner.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
