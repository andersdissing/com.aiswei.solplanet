<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; color: #222; }
    h2 { margin-top: 0; }
    p  { font-size: 14px; line-height: 1.4; }
    button { margin-top: 18px; padding: 10px 18px; background: #0B7AB8; color: white; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }
    button:disabled { background: #999; cursor: not-allowed; }
    .status { margin-top: 14px; min-height: 1.4em; font-size: 14px; color: #333; }
    .status.ok    { color: #0a7e2f; }
    .status.error { color: #c00; }
    .hint { color: #666; font-size: 12px; }
    pre.debug { margin-top: 18px; font-size: 11px; color: #555; background: #f4f4f4; padding: 8px; border-radius: 4px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Refresh device</h2>
  <p>Reload capability labels, units, and titles from the latest app version.</p>
  <p class="hint">Capability values reset briefly until the next polling tick (typically within a few seconds).</p>

  <button id="refreshBtn">Refresh now</button>
  <div id="status" class="status"></div>
  <pre id="debug" class="debug"></pre>

  <script type="application/javascript">
    function dbg(msg) {
      const el = document.getElementById('debug');
      const t = new Date().toISOString().slice(11, 23);
      el.textContent += '[' + t + '] ' + msg + '\n';
    }

    dbg('script loaded');
    dbg('typeof Homey at script load: ' + (typeof Homey));

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      dbg('button clicked');
      dbg('typeof Homey at click: ' + (typeof Homey));
      const status = document.getElementById('status');
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      status.className = 'status';
      status.textContent = 'Refreshing…';
      try {
        dbg('calling Homey.emit("refresh")...');
        const result = await Homey.emit('refresh');
        dbg('emit resolved: ' + JSON.stringify(result));
        if (result && result.ok) {
          status.className = 'status ok';
          status.textContent = 'Refreshed ' + result.count + ' capabilities. You can close this dialog.';
        } else if (result) {
          status.className = 'status error';
          status.textContent = 'Refreshed ' + result.count + ' capabilities, ' + ((result.failed || []).length) + ' failed.';
        } else {
          status.className = 'status error';
          status.textContent = 'Refresh returned no result.';
        }
      } catch (err) {
        dbg('emit threw: ' + (err && err.message ? err.message : String(err)));
        status.className = 'status error';
        status.textContent = (err && err.message) ? err.message : String(err);
      } finally {
        btn.disabled = false;
      }
    });

    dbg('click listener attached');

    function onHomeyReady(Homey) {
      dbg('onHomeyReady called; typeof Homey arg: ' + (typeof Homey));
      try { Homey.setTitle('Refresh device'); dbg('Homey.setTitle ok'); } catch (e) { dbg('setTitle threw: ' + e.message); }
      try { Homey.ready(); dbg('Homey.ready called'); } catch (e) { dbg('Homey.ready threw: ' + e.message); }
    }
  </script>
</body>
</html>
